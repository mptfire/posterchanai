name: Deploy gate

# THE FULL TEST SUITE, ON GITHUB'S MACHINES INSTEAD OF THE SERVER (2026-10-31: "use github actions to do our testing so
# we can save machine resources locally"). sync.sh pushes the commit it is about to deploy to `ci/<sha>`, waits for this
# workflow on that exact commit, and deploys only if every part is green. The suite is cut into PARTS deterministic
# slices (scripts/deploy_regression_gate.py --part K/N) that together cover every test file exactly once; each runner
# shards its slice again across its own CPUs, with the gate's flaky re-run. The local gate stays: PC_GATE=local ./sync.sh.

on:
  push:
    branches: [ 'ci/**' ]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  part:
    name: part ${{ matrix.part }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the Android signing-history guard reads the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-nostr.txt
            requirements-test.txt
            scripts/deploy-regression-requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: System packages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get "${APT_OPTS[@]}" update -qq \
               && sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends ffmpeg xvfb squashfs-tools \
                    fonts-noto-color-emoji fonts-liberation libgtk-3-0t64 libnss3 libgbm1 libasound2t64 pulseaudio pulseaudio-utils; then
              break
            fi
            sleep $((attempt * 20))
            [ "$attempt" = 3 ] && exit 1
          done

      # THE MACHINE THE SUITE WAS WRITTEN AGAINST: what server1 and every PosterChanOS box have and a stock runner does
      # not. bash as /bin/sh (Gentoo's; dash cannot do the multi-digit fd redirections the shell scripts use), node in
      # /usr/bin (tests that pin PATH=/usr/bin:/bin), the app's state directory, Liberation Sans as the default sans
      # (layout checks measure text), and acorn for the tests that parse the shipped client.
      - name: Match the target machine
        shell: bash
        run: |
          set -euo pipefail
          sudo ln -sf bash /bin/sh
          sudo ln -sf "$(command -v node)" /usr/bin/node
          sudo mkdir -p /var/lib/posterchanai && sudo chown "$USER" /var/lib/posterchanai
          npm install --no-save --no-package-lock acorn@8
          fc-match sans-serif

      - name: LiveKit for the call tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          source scripts/install/livekit.sh
          setup_livekit_server
          test -x livekit/livekit-server

      - name: Desktop app dependencies (Electron)
        working-directory: desktop
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && break; rm -rf node_modules; sleep $((i*15)); done
          timeout --kill-after=5s 120s node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron

      - name: Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv venv-unified
          venv-unified/bin/pip install -r requirements-nostr.txt -r requirements-test.txt -r scripts/deploy-regression-requirements.txt \
            huggingface_hub
          # The XRP SDK lives in its OWN venv on every node (scripts/install/exodus_xrp_sdk.sh) -- it pins websockets
          # below the app's -- and the XRP tests run it there.
          sudo mkdir -p /usr/local/libexec/pc-exodus && sudo chown "$USER" /usr/local/libexec/pc-exodus
          python -m venv /usr/local/libexec/pc-exodus/xrp-venv
          /usr/local/libexec/pc-exodus/xrp-venv/bin/pip install -r requirements-exodus-xrp.txt
          # torch for the image-generation code paths the tests drive with stubs (no GPU needed): the CPU wheel.
          venv-unified/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests, part ${{ matrix.part }} of 8
        timeout-minutes: 60
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          xvfb-run -a venv-unified/bin/python scripts/deploy_regression_gate.py --part ${{ matrix.part }}/8 --jobs 4 2>&1 | tee "$RUNNER_TEMP/gate.out"

      # The gate's summary names the failing tests; this re-runs exactly those, alone, with their full errors -- so a
      # red run says WHY in its own log instead of on a runner that is gone.
      - name: Why it failed
        if: failure()
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          ids=$(awk '/failing in the full suite/{f=1;next} f&&/^  tests\//{print $1} f&&!/^  /{f=0}' "$RUNNER_TEMP/gate.out" | head -20)
          [ -n "$ids" ] || exit 0
          xvfb-run -a venv-unified/bin/python -m pytest -q -p no:cacheprovider -rfE --tb=short $ids || true
